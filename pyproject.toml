[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "deepidv-chain"
version = "1.2.0"
description = "Python SDK for the deepidv chain layer — attestations, registry, transparency log, and offline bundle verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Deep Identity Inc.", email = "ip@deepidv.com" }
]
keywords = [
  "deepidv",
  "attestation",
  "transparency-log",
  "merkle",
  "verification",
  "cryptography",
  "ecdsa",
  "rfc8785"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "cryptography>=41.0",
  "httpx>=0.25",
  "pydantic>=2.5",
  "typing-extensions>=4.8; python_version<'3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "respx>=0.20",
  "mypy>=1.8",
  "ruff>=0.4",
  "hatch>=1.9",
  "build>=1.0",
  "twine>=4.0"
]

[project.urls]
Homepage = "https://proof.deepidv.com"
Repository = "https://github.com/deep-identity-inc/deepidv-chain-python"
Issues = "https://github.com/deep-identity-inc/deepidv-chain-python/issues"
Changelog = "https://github.com/deep-identity-inc/deepidv-chain-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/deepidv_chain"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that hit the staging API (require DEEPIDV_STAGING=1)"
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src/deepidv_chain", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line length — handled by formatter
  "UP006",  # we keep typing.List/Dict for Pydantic-on-3.9 runtime resolution
  "UP007",  # same — typing.Optional / typing.Union
  "UP035",  # same — typing imports
  "UP045",  # X | None deferred until 3.9 floor is dropped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]
"examples/**" = ["N802"]
