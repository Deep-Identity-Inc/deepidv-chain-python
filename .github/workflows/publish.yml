name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  full-ci:
    name: pre-release CI gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        if: matrix.python-version == '3.12'
        run: ruff check src/ tests/
      - name: mypy
        if: matrix.python-version == '3.12'
        run: mypy src/
      - name: pytest
        run: pytest -ra

  publish:
    name: build + upload to PyPI
    runs-on: ubuntu-latest
    needs: full-ci
    environment:
      name: pypi
      url: https://pypi.org/p/deepidv-chain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify tag matches package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "tag $tag != pyproject version $ver" >&2
            exit 1
          fi
      - name: install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: build
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --non-interactive dist/*
